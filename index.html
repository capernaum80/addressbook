<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1777ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="하수처리장 TMAP">
  <meta name="format-detection" content="telephone=no">
  <title>하수처리장 TMAP</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <style>
    :root{
      --blue:#1777ff;
      --bg:#f5f7fb;
      --text:#111827;
      --muted:#6b7280;
      --shadow:0 8px 20px rgba(15,23,42,.07);
      --safe-top:env(safe-area-inset-top);
      --safe-bottom:env(safe-area-inset-bottom);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
      overscroll-behavior-y:none;
      -webkit-text-size-adjust:100%;
    }

    body{
      min-height:100vh;
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }

    input{
      -webkit-user-select:text;
      user-select:text;
      -webkit-touch-callout:default;
    }

    button,input{font:inherit}

    .app{
      max-width:520px;
      min-height:100vh;
      margin:0 auto;
      position:relative;
      padding-bottom:calc(64px + var(--safe-bottom));
      background:linear-gradient(180deg,#f9fbff 0,#f4f7fb 42%,#f3f6fa 100%);
      overscroll-behavior-y:none;
    }

    .app.searching{padding-bottom:18px}

    .top{
      position:sticky;
      top:0;
      z-index:10;
      padding:calc(18px + var(--safe-top)) 16px 10px;
      background:rgba(249,251,255,.92);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(229,231,235,.7);
    }

    .titlebar{margin-bottom:14px}
    .title{font-size:24px;font-weight:800;letter-spacing:-.04em}
    .version{margin-top:3px;font-size:12px;color:var(--muted)}

    .search-box{
      min-height:58px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 14px;
      background:#fff;
      border:2px solid rgba(23,119,255,.9);
      border-radius:18px;
      box-shadow:var(--shadow);
    }

    .search-icon{font-size:22px;color:#365da8}
    .search-input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#111;
      font-size:20px;
      padding:0;
      -webkit-appearance:none;
      appearance:none;
    }
    .search-input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
    .clear-btn{
      border:0;
      background:transparent;
      color:#9ca3af;
      font-size:28px;
      padding:0 2px;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }

    .chips{
      display:flex;
      gap:10px;
      padding:14px 2px 4px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .chips::-webkit-scrollbar{display:none}
    .chip{
      flex:0 0 auto;
      min-width:82px;
      height:42px;
      border:1px solid #d7dce5;
      border-radius:13px;
      background:#fff;
      color:#111;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(15,23,42,.04);
      -webkit-tap-highlight-color:transparent;
    }
    .chip.active{
      color:#fff;
      border-color:#176dff;
      background:linear-gradient(180deg,#2a8cff,#176dff);
    }

    .content{padding:16px}

    .hero{
      margin-top:46px;
      text-align:center;
      color:var(--muted);
    }
    .hero .big{font-size:120px;opacity:.16;line-height:1}
    .hero h2{
      margin:12px 0 8px;
      color:#111827;
      font-size:34px;
      letter-spacing:-.04em;
    }
    .hero p{margin:0;font-size:19px;line-height:1.55}

    .count{
      padding:4px 2px 10px;
      color:#4b5563;
      font-size:15px;
      font-weight:700;
    }

    .list{display:flex;flex-direction:column;gap:12px}
    .item{
      width:100%;
      padding:16px 14px;
      display:flex;
      align-items:center;
      gap:12px;
      border:1px solid rgba(255,255,255,.9);
      border-radius:18px;
      background:#fff;
      box-shadow:var(--shadow);
      cursor:pointer;
      text-align:left;
      -webkit-tap-highlight-color:transparent;
    }
    .item-main{min-width:0;flex:1}
    .item-title{
      margin-bottom:4px;
      font-size:24px;
      font-weight:800;
      letter-spacing:-.03em;
      word-break:keep-all;
    }
    .item-address{font-size:20px;color:#374151;word-break:break-word}
    .tag{
      display:inline-flex;
      align-items:center;
      height:26px;
      margin-top:8px;
      padding:0 10px;
      border-radius:999px;
      font-size:13px;
      font-weight:800;
    }
    .tag.plant{background:#eff6ff;color:#1d4ed8}
    .tag.pump{background:#edfdf3;color:#0f9f57}
    .go{
      width:46px;
      height:46px;
      flex:0 0 46px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:50%;
      background:linear-gradient(180deg,#2a8cff,#176dff);
      color:#fff;
      font-size:22px;
      box-shadow:0 8px 16px rgba(23,119,255,.25);
    }

    .bottom-nav{
      position:fixed;
      left:0;right:0;bottom:0;
      z-index:20;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .bottom-nav.hidden{display:none}
    .bottom-inner{
      width:min(520px,100%);
      padding-bottom:var(--safe-bottom);
      background:linear-gradient(180deg,#2a8cff 0%,#176dff 100%);
      box-shadow:0 -3px 12px rgba(23,119,255,.16);
      pointer-events:auto;
    }
    .update-main-btn{
      width:100%;
      height:64px;
      border:0;
      background:transparent;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-size:20px;
      font-weight:800;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .update-main-btn .icon{font-size:27px}
    .update-main-btn:active{background:rgba(0,0,0,.08)}

    .status-card,.update-card{
      padding:28px 22px;
      border-radius:24px;
      background:#fff;
      box-shadow:var(--shadow);
      text-align:center;
    }
    .status-card .emoji,.update-card .emoji{font-size:70px;line-height:1;margin-bottom:10px}
    .status-card h3,.update-card h3{margin:8px 0 4px;font-size:31px;letter-spacing:-.04em}
    .status-card p,.update-card p{margin:0;color:var(--muted);font-size:19px;line-height:1.55}

    .rows{
      margin-top:16px;
      overflow:hidden;
      border:1px solid #e5e7eb;
      border-radius:16px;
      text-align:left;
    }
    .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      border-top:1px solid #eef2f7;
      font-size:16px;
    }
    .row:first-child{border-top:0}
    .update-actions{display:flex;gap:10px;margin-top:18px}
    .update-actions button{
      flex:1;height:56px;border-radius:16px;font-size:20px;font-weight:800;cursor:pointer
    }
    .btn-outline{border:2px solid #94a3b8;background:#fff;color:#334155}
    .btn-primary{border:0;background:linear-gradient(180deg,#2a8cff,#176dff);color:#fff}

    .sheet-backdrop{
      position:fixed;
      inset:0;
      z-index:30;
      display:none;
      background:rgba(17,24,39,.28);
    }
    .sheet-backdrop.show{display:block}
    .sheet{
      position:absolute;
      left:0;right:0;bottom:0;
      padding:14px 18px calc(20px + var(--safe-bottom));
      border-radius:24px 24px 0 0;
      background:#fff;
      box-shadow:0 -20px 40px rgba(17,24,39,.18);
    }
    .grab{width:58px;height:6px;margin:0 auto 12px;border-radius:999px;background:#d1d5db}
    .sheet h3{margin:0 0 6px;text-align:center;font-size:32px;letter-spacing:-.05em}
    .address-line{
      display:flex;
      align-items:flex-start;
      justify-content:center;
      gap:8px;
      margin:0 0 18px;
      color:#374151;
      font-size:20px;
      line-height:1.5;
      text-align:center;
    }
    .sheet-btn{
      width:100%;
      height:58px;
      margin-top:10px;
      border:2px solid #176dff;
      border-radius:16px;
      background:#fff;
      color:#176dff;
      font-size:23px;
      font-weight:800;
      cursor:pointer;
    }
    .sheet-btn.primary{border:0;background:linear-gradient(180deg,#2a8cff,#176dff);color:#fff}
    .sheet-btn.gray{border:0;background:#eef2f7;color:#4b5563}

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(88px + var(--safe-bottom));
      z-index:50;
      max-width:90vw;
      padding:12px 16px;
      border-radius:999px;
      background:rgba(17,24,39,.92);
      color:#fff;
      font-size:14px;
      opacity:0;
      pointer-events:none;
      transform:translateX(-50%) translateY(20px);
      transition:.2s ease;
      white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:420px){
      .title{font-size:22px}
      .search-input{font-size:18px}
      .item-title{font-size:21px}
      .item-address,.address-line{font-size:17px}
      .sheet h3{font-size:28px}
      .hero h2,.status-card h3,.update-card h3{font-size:28px}
      .hero p,.status-card p,.update-card p{font-size:17px}
    }
  </style>
</head>

<body>
  <main class="app" id="app">
    <header class="top">
      <div class="titlebar">
        <div class="title">하수처리장 TMAP</div>
        <div class="version" id="versionText">로컬 주소록 불러오는 중...</div>
      </div>

      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" class="search-input" type="search"
          inputmode="search" enterkeyhint="search" placeholder="어디로 갈까요?"
          autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        <button id="clearBtn" class="clear-btn" type="button" aria-label="검색어 지우기">×</button>
      </div>

      <div class="chips">
        <button class="chip active" data-filter="all" type="button">전체</button>
        <button class="chip" data-filter="plant" type="button">처리장</button>
        <button class="chip" data-filter="pump" type="button">맨홀·펌프장</button>
      </div>
    </header>

    <section class="content" id="searchView">
      <div id="searchState"></div>
      <div id="resultHeader" class="count" style="display:none"></div>
      <div id="resultList" class="list"></div>
    </section>

    <section class="content" id="updateView" style="display:none"></section>
  </main>

  <div class="bottom-nav" id="bottomNav">
    <div class="bottom-inner">
      <button id="updateMainBtn" class="update-main-btn" type="button">
        <span class="icon">↻</span><span>주소록 업데이트</span>
      </button>
    </div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet">
      <div class="grab"></div>
      <h3 id="sheetTitle">장소명</h3>
      <div class="address-line"><span>📍</span><span id="sheetAddress"></span></div>
      <button id="copyBtn" class="sheet-btn" type="button">주소 복사</button>
      <button id="tmapBtn" class="sheet-btn primary" type="button">TMAP으로 길안내</button>
      <button id="closeSheetBtn" class="sheet-btn gray" type="button">취소</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
'use strict';
// BUILD: 2026-08-14-clean-v7-keyboard-hide-blur

/*
  v7 핵심 원칙

  1) Android의 V(키보드 내리기)는 웹페이지가 "검색키"로 바꿔 누르는 것이 아닙니다.
     대신 키보드가 실제로 내려간 것을 visualViewport로 감지한 뒤
     searchInput.blur()만 실행합니다.
     => 글자는 그대로, 커서만 사라짐.

  2) 키보드의 돋보기/검색키(Enter)도 searchInput.blur()만 실행합니다.
     => V와 돋보기의 최종 결과가 동일:
        키보드 내려감 + 글자 유지 + 커서 없음.

  3) 키보드가 내려간 상태에서 Android <:
     검색어가 있으면 커서와 무관하게 검색어만 삭제.
     검색어가 없으면 앱 종료.

  4) 상세창에서 Android <:
     검색 결과로만 복귀. 검색어/필터 유지.

  키보드 상태를 history에 넣지 않습니다.
  키보드 V와 실제 뒤로가기를 history로 구분하려 하지 않습니다.
*/

const PROXY_URL = 'https://script.google.com/macros/s/AKfycbxehvKiQkegGrCZbraOnHYdy15yWmNHHa4ulnGB4MFzBOHbmn8AeeOUU-jOjXBoCSc/exec';
const STORAGE_KEY = 'facility_addressbook_cache_v1';
const STORAGE_META_KEY = 'facility_addressbook_meta_v1';
const REQUEST_TIMEOUT = 20000;
const RETRY_DELAYS = [800, 1500];

const state = {
  records: [],
  filter: 'all',
  query: '',
  selected: null,
  localMeta: null,
  remoteMeta: null,
  leavingApp: false
};

const el = {
  app: document.getElementById('app'),
  versionText: document.getElementById('versionText'),
  searchInput: document.getElementById('searchInput'),
  clearBtn: document.getElementById('clearBtn'),
  chips: [...document.querySelectorAll('.chip')],
  searchState: document.getElementById('searchState'),
  resultHeader: document.getElementById('resultHeader'),
  resultList: document.getElementById('resultList'),
  searchView: document.getElementById('searchView'),
  updateView: document.getElementById('updateView'),
  bottomNav: document.getElementById('bottomNav'),
  updateMainBtn: document.getElementById('updateMainBtn'),
  sheetBackdrop: document.getElementById('sheetBackdrop'),
  sheetTitle: document.getElementById('sheetTitle'),
  sheetAddress: document.getElementById('sheetAddress'),
  copyBtn: document.getElementById('copyBtn'),
  tmapBtn: document.getElementById('tmapBtn'),
  closeSheetBtn: document.getElementById('closeSheetBtn'),
  toast: document.getElementById('toast')
};

/* ---------------------------
   history: 키보드는 관여하지 않음
---------------------------- */

function layer() {
  return history.state && history.state.layer ? history.state.layer : '';
}

function installHistory() {
  try {
    history.replaceState({ layer: 'base' }, '', location.href);
    history.pushState({ layer: 'guard' }, '', location.href);
  } catch (_) {}
}

function ensureGuard() {
  if (layer() !== 'guard') {
    try { history.pushState({ layer: 'guard' }, '', location.href); } catch (_) {}
  }
}

/* ---------------------------
   공통
---------------------------- */

function normalizeText(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/충청남도/g, '')
    .replace(/부여군/g, '')
    .replace(/[\s\-_\/.,()]/g, '');
}

function groupType(category, name) {
  return /처리장/.test(`${category || ''} ${name || ''}`) ? 'plant' : 'pump';
}

function buildFullAddress(address) {
  const text = String(address || '').trim();
  if (!text) return '';
  if (/^충청남도\s*부여군/.test(text)) return text;
  return '충청남도 부여군 ' + text;
}

function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, m => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[m]));
}

function formatTime(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d)) return String(value);

  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');

  return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
}

function showToast(message) {
  el.toast.textContent = message;
  el.toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.toast.classList.remove('show'), 1800);
}

function setVersionText(meta, prefix = '저장된 주소록') {
  if (!meta) {
    el.versionText.textContent = '저장된 주소록이 없습니다.';
    return;
  }

  const when = formatTime(meta.updated || meta.version);
  const total = meta.total ? ` · ${meta.total}개` : '';
  el.versionText.textContent = `${prefix}: ${when}${total}`;
}

function saveLocal(records, meta) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  localStorage.setItem(STORAGE_META_KEY, JSON.stringify(meta));
}

function loadLocal() {
  try {
    return {
      records: JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'),
      meta: JSON.parse(localStorage.getItem(STORAGE_META_KEY) || 'null')
    };
  } catch (_) {
    return { records: [], meta: null };
  }
}

function hydrateRecords(records) {
  return (records || []).map((r, idx) => {
    const category = r.category || '';
    const name = String(r.name || '').trim();
    const address = String(r.address || '').trim();
    const type = r.type || groupType(category, name);

    return {
      id: r.id || idx + 1,
      category,
      name,
      address,
      fullAddress: buildFullAddress(address),
      type,
      searchable: normalizeText(`${category} ${name} ${address} ${r.aliases || ''}`)
    };
  }).filter(r => r.name && r.address);
}

function syncBottomBar() {
  const searching =
    document.activeElement === el.searchInput ||
    String(state.query || '').trim().length > 0 ||
    el.sheetBackdrop.classList.contains('show') ||
    el.updateView.style.display === 'block';

  el.bottomNav.classList.toggle('hidden', searching);
  el.app.classList.toggle('searching', searching);
}

function resetFilter() {
  state.filter = 'all';
  el.chips.forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
}

/* ---------------------------
   검색 렌더링
---------------------------- */

function renderEmptyHero() {
  el.resultHeader.style.display = 'none';
  el.resultList.innerHTML = '';
  el.searchState.innerHTML = `
    <div class="hero">
      <div class="big">⌕</div>
      <h2>목적지명을 검색하세요</h2>
      <p>처리장명, 맨홀명 또는<br>주소를 입력하세요</p>
    </div>`;
}

function renderNoResult() {
  el.resultHeader.style.display = 'none';
  el.resultList.innerHTML = '';
  el.searchState.innerHTML = `
    <div class="hero" style="margin-top:30px">
      <div class="big">⌕</div>
      <h2>검색 결과가 없습니다</h2>
      <p>다른 검색어로 다시 시도해 주세요</p>
    </div>`;
}

function renderResults() {
  syncBottomBar();

  const raw = String(state.query || '');
  if (!raw.trim()) {
    renderEmptyHero();
    return;
  }

  const q = normalizeText(raw);
  const filtered = state.records.filter(r => {
    if (state.filter !== 'all' && r.type !== state.filter) return false;
    return r.searchable.includes(q);
  });

  el.searchState.innerHTML = '';

  if (!filtered.length) {
    renderNoResult();
    return;
  }

  el.resultHeader.style.display = 'block';
  el.resultHeader.textContent = `검색 결과 ${filtered.length}개`;

  el.resultList.innerHTML = filtered.map(item => `
    <button class="item" type="button" data-id="${item.id}">
      <div class="item-main">
        <div class="item-title">${escapeHtml(item.name)}</div>
        <div class="item-address">${escapeHtml(item.address)}</div>
        <div class="tag ${item.type}">${item.type === 'plant' ? '처리장' : '맨홀·펌프장'}</div>
      </div>
      <div class="go">➜</div>
    </button>
  `).join('');

  el.resultList.querySelectorAll('.item').forEach(btn => {
    btn.addEventListener('click', () => {
      const found = state.records.find(r => String(r.id) === btn.dataset.id);
      if (found) {
        // 결과를 눌렀다면 키보드/커서는 끝낸 뒤 상세창 열기
        el.searchInput.blur();
        openSheet(found);
      }
    });
  });
}

function clearSearch() {
  el.searchInput.value = '';
  state.query = '';
  el.searchInput.blur();
  resetFilter();
  renderResults();
  syncBottomBar();
}

function showSearchSurface() {
  el.searchView.style.display = 'block';
  el.updateView.style.display = 'none';
}

/* ---------------------------
   키보드
---------------------------- */

/*
  Android V를 웹에서 키보드 검색키로 "바꾸는" 것은 불가능합니다.
  대신 V로 키보드가 실제로 닫힌 순간을 감지해서 blur()를 실행합니다.
  이것이 사용자가 원하는 최종 상태를 정확히 만듭니다.

  - 검색어 유지
  - 키보드 닫힘
  - 커서 없음
*/

const keyboard = {
  fullHeight: window.visualViewport ? window.visualViewport.height : window.innerHeight,
  wasOpen: false,
  threshold: 110
};

function noteViewportHeight() {
  const vv = window.visualViewport;
  const current = vv ? vv.height : window.innerHeight;

  // 입력창에 포커스가 없을 때의 큰 높이를 "키보드 닫힌 높이"로 계속 보정
  if (document.activeElement !== el.searchInput && current > keyboard.fullHeight) {
    keyboard.fullHeight = current;
  }

  const keyboardNowOpen = keyboard.fullHeight - current > keyboard.threshold;

  if (keyboardNowOpen) {
    keyboard.wasOpen = true;
  }

  /*
    키보드가 열려 있었다가 닫혔는데 input focus가 아직 남아 있으면
    바로 blur하여 커서를 제거합니다.
    검색어는 절대 건드리지 않습니다.
  */
  if (
    keyboard.wasOpen &&
    !keyboardNowOpen &&
    document.activeElement === el.searchInput
  ) {
    keyboard.wasOpen = false;
    setTimeout(() => {
      if (document.activeElement === el.searchInput) {
        el.searchInput.blur();
      }
      syncBottomBar();
    }, 0);
  }

  if (!keyboardNowOpen && document.activeElement !== el.searchInput) {
    keyboard.wasOpen = false;
    keyboard.fullHeight = Math.max(keyboard.fullHeight, current);
  }
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', noteViewportHeight);
} else {
  window.addEventListener('resize', noteViewportHeight);
}

/* ---------------------------
   상세창
---------------------------- */

function openSheet(item) {
  state.selected = item;
  el.sheetTitle.textContent = item.name;
  el.sheetAddress.textContent = item.fullAddress;
  el.sheetBackdrop.classList.add('show');

  try { history.pushState({ layer: 'sheet' }, '', location.href); } catch (_) {}
  syncBottomBar();
}

function closeSheetVisual() {
  el.sheetBackdrop.classList.remove('show');
  state.selected = null;
  showSearchSurface();
  renderResults();
  syncBottomBar();
}

function closeSheetByUser() {
  if (layer() === 'sheet') {
    history.back();
  } else {
    closeSheetVisual();
  }
}

async function copySelectedAddress() {
  if (!state.selected) return;

  try {
    await navigator.clipboard.writeText(state.selected.fullAddress);
    showToast('주소를 복사했습니다');
  } catch (_) {
    showToast('주소 복사에 실패했습니다');
  }
}

async function openTmap() {
  if (!state.selected) return;

  const address = state.selected.fullAddress;

  try {
    await navigator.clipboard.writeText(address);
  } catch (_) {}

  window.location.href = `tmap://search?name=${encodeURIComponent(address)}`;
}

/* ---------------------------
   주소록 업데이트
---------------------------- */

function showUpdateLoading() {
  closeSheetVisual();
  el.searchView.style.display = 'none';
  el.updateView.style.display = 'block';

  el.updateView.innerHTML = `
    <div class="status-card">
      <div class="emoji">↻</div>
      <h3>주소록 업데이트 확인 중...</h3>
      <p>잠시만 기다려주세요.</p>
    </div>`;

  syncBottomBar();
}

function renderUpdateResult(meta, hasUpdate) {
  const local = state.localMeta || {};

  el.updateView.innerHTML = `
    <div class="update-card">
      <div class="emoji">${hasUpdate ? '⬇' : '✓'}</div>
      <h3>${hasUpdate ? '새로운 주소록이 있습니다.' : '현재 최신 주소록입니다.'}</h3>
      <p>${hasUpdate ? '업데이트하시겠습니까?' : '현재 저장된 주소록이 가장 최신 버전입니다.'}</p>
      <div class="rows">
        <div class="row"><strong>현재 버전</strong><span>${formatTime(local.updated || local.version) || '-'}</span></div>
        <div class="row"><strong>새 버전</strong><span>${formatTime(meta.updated || meta.version) || '-'}</span></div>
        <div class="row"><strong>주소 개수</strong><span>${meta.total || 0}개</span></div>
      </div>
      <div class="update-actions">
        <button class="btn-outline" id="cancelUpdateBtn" type="button">취소</button>
        <button class="btn-primary" id="runUpdateBtn" type="button">${hasUpdate ? '업데이트' : '다시받기'}</button>
      </div>
    </div>`;

  document.getElementById('cancelUpdateBtn').addEventListener('click', closeUpdateByUser);
  document.getElementById('runUpdateBtn').addEventListener('click', bootstrapFromServer);
}

function renderUpdateError(message) {
  el.updateView.innerHTML = `
    <div class="status-card">
      <div class="emoji">⚠</div>
      <h3>업데이트 확인 실패</h3>
      <p>${escapeHtml(message)}</p>
      <div class="update-actions">
        <button class="btn-outline" id="backUpdateBtn" type="button">검색으로</button>
        <button class="btn-primary" id="retryUpdateBtn" type="button">다시 시도</button>
      </div>
    </div>`;

  document.getElementById('backUpdateBtn').addEventListener('click', closeUpdateByUser);
  document.getElementById('retryUpdateBtn').addEventListener('click', checkForUpdates);
}

function closeUpdateByUser() {
  if (layer() === 'update') {
    history.back();
  } else {
    showSearchSurface();
    ensureGuard();
    renderResults();
    syncBottomBar();
  }
}

/* ---------------------------
   서버
---------------------------- */

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const callback = '__addr_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    let finished = false;

    const cleanup = () => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      try { delete window[callback]; } catch (_) {}
      try { script.remove(); } catch (_) {}
    };

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('응답 시간이 초과되었습니다.'));
    }, REQUEST_TIMEOUT);

    window[callback] = payload => {
      cleanup();
      resolve(payload || {});
    };

    script.onerror = () => {
      cleanup();
      reject(new Error('서버에 연결하지 못했습니다.'));
    };

    const query = new URLSearchParams({
      ...params,
      callback,
      t: Date.now().toString()
    });

    script.src = PROXY_URL + '?' + query.toString();
    document.head.appendChild(script);
  });
}

async function request(params) {
  let lastError;

  for (let i = 0; i < 3; i++) {
    try {
      const res = await jsonp(params);
      if (!res.ok) throw new Error(res.error || '요청에 실패했습니다.');
      return res;
    } catch (err) {
      lastError = err;

      if (i < 2) {
        await new Promise(r =>
          setTimeout(r, RETRY_DELAYS[Math.min(i, RETRY_DELAYS.length - 1)])
        );
      }
    }
  }

  throw lastError;
}

async function bootstrapFromServer() {
  showUpdateLoading();

  try {
    const res = await request({ action: 'bootstrap' });

    state.records = hydrateRecords(res.records);
    state.localMeta = {
      version: res.version,
      updated: res.updated,
      total: res.total
    };

    saveLocal(state.records, state.localMeta);
    setVersionText(state.localMeta);
    showToast('주소록을 업데이트했습니다');

    if (layer() === 'update') {
      history.back();
    } else {
      showSearchSurface();
      ensureGuard();
      renderResults();
      syncBottomBar();
    }
  } catch (err) {
    renderUpdateError(err.message || '주소록을 받아오지 못했습니다.');
  }
}

async function checkForUpdates() {
  el.searchInput.blur();

  try { history.pushState({ layer: 'update' }, '', location.href); } catch (_) {}
  showUpdateLoading();

  try {
    const res = await request({ action: 'meta' });

    state.remoteMeta = {
      version: res.version,
      updated: res.updated,
      total: res.total
    };

    const localVersion = state.localMeta?.version || '';
    const remoteVersion = state.remoteMeta.version || '';
    const hasUpdate =
      !localVersion ||
      String(localVersion) !== String(remoteVersion);

    renderUpdateResult(state.remoteMeta, hasUpdate);
  } catch (err) {
    renderUpdateError(err.message || '업데이트 정보를 가져오지 못했습니다.');
  }
}

/* ---------------------------
   Android 시스템 뒤로가기
---------------------------- */

window.addEventListener('popstate', e => {
  if (state.leavingApp) return;

  const targetLayer = e.state?.layer || '';

  // 상세창 < = 검색 결과로만 복귀
  if (el.sheetBackdrop.classList.contains('show')) {
    closeSheetVisual();
    ensureGuard();
    return;
  }

  // 업데이트 화면 < = 검색 화면으로 복귀
  if (el.updateView.style.display === 'block') {
    showSearchSurface();
    ensureGuard();
    renderResults();
    syncBottomBar();
    return;
  }

  /*
    실제 < 뒤로가기:
    커서 위치는 전혀 보지 않고,
    검색창에 글자가 있으면 첫 번째 <에서 바로 글자만 삭제.
  */
  const hasQuery = String(state.query || '').trim().length > 0;

  if (hasQuery) {
    clearSearch();
    ensureGuard();
    return;
  }

  // 검색어 없는 메인에서 < = 앱 종료
  if (targetLayer === 'base' || targetLayer === 'guard' || !targetLayer) {
    state.leavingApp = true;
    history.back();
  }
});

/* ---------------------------
   입력 이벤트
---------------------------- */

el.searchInput.addEventListener('focus', () => {
  syncBottomBar();
  noteViewportHeight();
});

el.searchInput.addEventListener('blur', () => {
  setTimeout(syncBottomBar, 0);
});

el.searchInput.addEventListener('input', e => {
  state.query = e.target.value;
  renderResults();
});

/*
  키보드 돋보기/검색키:
  검색어 유지 + 키보드 종료 + 커서 제거
*/
el.searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    el.searchInput.blur();
    syncBottomBar();
  }
});

el.clearBtn.addEventListener('click', () => {
  el.searchInput.value = '';
  state.query = '';
  resetFilter();
  renderResults();
  el.searchInput.focus();
});

el.chips.forEach(chip => {
  chip.addEventListener('click', () => {
    el.chips.forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    renderResults();
  });
});

el.updateMainBtn.addEventListener('click', checkForUpdates);

el.sheetBackdrop.addEventListener('click', e => {
  if (e.target === el.sheetBackdrop) closeSheetByUser();
});

el.closeSheetBtn.addEventListener('click', closeSheetByUser);
el.copyBtn.addEventListener('click', copySelectedAddress);
el.tmapBtn.addEventListener('click', openTmap);

/* 일반 텍스트 길게 누르기/Chrome 검색 메뉴 방지 */
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('input,textarea')) e.preventDefault();
}, true);

document.addEventListener('selectstart', e => {
  if (!e.target.closest('input,textarea')) e.preventDefault();
}, true);

document.addEventListener('dragstart', e => {
  if (!e.target.closest('input,textarea')) e.preventDefault();
}, true);

/* ---------------------------
   시작
---------------------------- */

function loadAtStartup() {
  installHistory();

  const local = loadLocal();
  state.records = hydrateRecords(local.records || []);
  state.localMeta = local.meta;

  setVersionText(state.localMeta);
  showSearchSurface();
  renderResults();
  syncBottomBar();

  if (!state.records.length) {
    try { history.pushState({ layer: 'update' }, '', location.href); } catch (_) {}
    bootstrapFromServer();
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(reg => reg.update().catch(() => {})))
    .catch(() => {});
}

loadAtStartup();
</script>
